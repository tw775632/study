<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>天黑后的房间</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      animation:fadeToBlack 10s forwards;
    }
    
    button {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    
     @keyframes fadeToBlack {
      from {
        background-color:skyblue;
      }
      to {
        background-color:black;
      }
     }
  </style>
</head>
<body>
  <button id="myButton">时光流逝</button>

  <script>
    const btn = document.getElementById('myButton');
    let isBlack = false;

    btn.addEventListener('click', function () {
      isBlack = !isBlack;
      document.body.style.backgroundColor = isBlack ? 'black' : 'skyblue';
    });
  </script>
</body>
</html>
