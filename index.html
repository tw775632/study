<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>白房间变黑</title>
  <style>
    body {
      background-color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.5s;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="myButton">按我变黑</button>

  <script>
    const btn = document.getElementById('myButton');
    let isBlack = false;

    btn.addEventListener('click', function () {
      isBlack = !isBlack;
      document.body.style.backgroundColor = isBlack ? 'black' : 'white';
    });
  </script>
</body>
</html>
